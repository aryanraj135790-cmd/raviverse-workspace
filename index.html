<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | RaviVerse Workspace</title>
    <meta
      name="description"
      content="Discover all your essential workspaces in one spot."
    />
    <link rel="stylesheet" href="./css/base.css" />
  </head>
  <body>
    <header>
      <a href="/">RaviVerse Workspace</a>
      <div>
        <button type="button">Search</button>
        <button type="button">Profile</button>
      </div>
    </header>
    <div class="content-wrapper">
      <aside>
        <nav aria-label="Main menu">
          <ul>
            <li><a href="/dashboard" aria-current="page">Dashboard</a></li>
            <li><a href="/projects">Projects</a></li>
            <li><a href="/tasks">Tasks</a></li>
            <li><a href="/notes">Notes</a></li>
            <li><a href="/snippets">Snippets</a></li>
            <li><a href="/settings">Settings</a></li>
          </ul>
        </nav>
      </aside>
      <main>
        <div class="main-content">
          <header>
            <div>
              <h1>Dashboard</h1>
              <p>Welcome to your RaviVerse Workspace.</p>
            </div>
            <button id="dashboard-refresh" type="button">
              Refresh Dashboard
            </button>
          </header>
          <p id="dashboard-status" class="sr-only" role="status">
            Dashboard is ready.
          </p>
          <section class="dashboard-section">
            <h2>Quick Overview</h2>
            <div class="overview-grid">
              <div class="overview-item">
                <h3>Projects</h3>
                <p class="overview-value" data-dashboard-stat="projects">0</p>
              </div>

              <div class="overview-item">
                <h3>Tasks</h3>
                <p class="overview-value" data-dashboard-stat="tasks">0</p>
              </div>

              <div class="overview-item">
                <h3>Notes</h3>
                <p class="overview-value" data-dashboard-stat="notes">0</p>
              </div>
              <div class="overview-item">
                <h3>Completed Tasks</h3>
                <p class="overview-value" data-dashboard-stat="completedTasks">
                  0
                </p>
              </div>
              <div class="overview-item">
                <h3>Pending Tasks</h3>
                <p class="overview-value" data-dashboard-stat="pendingTasks">
                  0
                </p>
              </div>
            </div>
          </section>
          <section class="dashboard-section">
            <h2>Recent Activity</h2>
            <ul id="recent-activity-list" class="recent-activity-list"></ul>
          </section>
        </div>
      </main>
    </div>
    <div id="toast-container" aria-live="polite"></div>
    <!-- Scrips -->
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
