<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | RaviVerse Workspace</title>
    <meta
      name="description"
      content="Discover all your essential workspaces in one spot."
    />
    <link rel="stylesheet" href="./css/base.css" />
  </head>
  <body>
    <header>
      <a href="/">RaviVerse Workspace</a>
      <div>
        <button type="button">Search</button>
        <button id="profile-button" type="button">Profile</button>
      </div>
    </header>
    <main id="auth-view"></main>
    <div id="workspace-view" class="content-wrapper" hidden>
      <aside>
        <nav aria-label="Main menu">
          <ul>
            <li><a href="/dashboard" aria-current="page">Dashboard</a></li>
            <li><a href="/projects">Projects</a></li>
            <li><a href="/tasks">Tasks</a></li>
            <li><a href="/notes">Notes</a></li>
            <li><a href="/snippets">Snippets</a></li>
            <li><a href="/settings">Settings</a></li>
          </ul>
        </nav>
      </aside>
      <main id="app-view"></main>
    </div>
    <div id="toast-container" aria-live="polite"></div>
    <!-- Scrips -->
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
